name: lint

# Style/correctness gate (flake8 default ruleset). Runs only for PRs
# targeting main, since that's the release branch — dev-pycore and feature
# branches are not gated on this.
on:
  pull_request:
    branches: [main]

jobs:
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 benchlab tests benchlab.py bootstrap.py
