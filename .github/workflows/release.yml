name: release

# Builds and publishes a tagged release. Triggered by pushing a tag like
# v3.0.0 — the tag version must match benchlab/__init__.py::__version__.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build and verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('benchlab/__init__.py').read()).group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match benchlab/__init__.py version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          pip install -r benchlab/requirements.txt
          pip install -r benchlab/csv_log/requirements.txt
          pip install -r benchlab/graph/requirements.txt
          pip install -r benchlab/wigidash/requirements.txt
          pip install -r benchlab/vu/requirements.txt
          pip install pytest build

      - name: Run test suite
        run: pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Build source zip for non-pip customers
        shell: bash
        run: |
          git archive --format=zip --prefix=benchlab-pytools-${GITHUB_REF_NAME#v}/ -o dist/benchlab-pytools-${GITHUB_REF_NAME#v}-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Remove source zip before PyPI upload
        run: rm -f dist/*-source.zip

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
