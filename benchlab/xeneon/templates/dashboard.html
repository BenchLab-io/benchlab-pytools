<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeneon Dashboard - BenchLab Telemetry</title>

    <!-- Favicon -->
    <link rel="icon" href="/xeneon/static/favicon.ico" type="image/x-icon">

    <!--
        Google Fonts - loaded once here via <link> (fastest approach).
        The duplicate @import that was inside dashboard.css has been removed.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/xeneon/static/css/dashboard.css">
</head>
<body>
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-content">
            <h1 class="dashboard-title" id="page-title">BENCHLAB XENEON</h1>
            <div class="header-status">
                <span class="status-indicator" id="connection-status">●</span>
                <span class="status-text" id="status-text">Connecting...</span>
            </div>
        </div>
    </header>

    <!-- Main Content - Three Section Layout -->
    <main class="dashboard-main">

        <!-- Left Section (A) - Fleet and Device Selection -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <h2 class="logo-text">BENCHLAB</h2>
                    <span class="logo-subtext">XENEON</span>
                </div>
            </div>

            <div class="device-selector">
                <h3 class="section-title">Devices</h3>
                <div class="device-list" id="fleet-device-list">
                    <div class="device-item placeholder">
                        <div class="device-info">
                            <span class="device-name">Scanning for devices...</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Middle Section (B) - Sensor Display -->
        <section class="dashboard-center">
            <div class="sensor-grid-scroll">
                <div class="sensor-grid">

                    <!-- Summary -->
                    <div class="sensor-card" data-sensor-type="summary">
                        <div class="card-header">
                            <h3>SUMMARY</h3>
                        </div>
                        <div class="card-content" id="card-summary"></div>
                    </div>

                    <!-- Temperature -->
                    <div class="sensor-card" data-sensor-type="temperatures">
                        <div class="card-header">
                            <h3>TEMPERATURES</h3>
                        </div>
                        <div class="card-content" id="card-temperatures"></div>
                    </div>

                    <!-- Fans -->
                    <div class="sensor-card" data-sensor-type="fans">
                        <div class="card-header">
                            <h3>FANS</h3>
                        </div>
                        <div class="card-content" id="card-fans"></div>
                    </div>

                    <!-- Power -->
                    <div class="sensor-card" data-sensor-type="power">
                        <div class="card-header">
                            <h3>POWER</h3>
                        </div>
                        <div class="card-content" id="card-power"></div>
                    </div>

                    <!-- Current -->
                    <div class="sensor-card" data-sensor-type="current">
                        <div class="card-header">
                            <h3>CURRENT</h3>
                        </div>
                        <div class="card-content" id="card-current"></div>
                    </div>

                    <!-- Voltage -->
                    <div class="sensor-card" data-sensor-type="voltage">
                        <div class="card-header">
                            <h3>VOLTAGE</h3>
                        </div>
                        <div class="card-content" id="card-voltage"></div>
                    </div>

                    <!-- Voltage Inputs -->
                    <div class="sensor-card" data-sensor-type="vins">
                        <div class="card-header">
                            <h3>VOLTAGE INPUTS</h3>
                        </div>
                        <div class="card-content" id="card-vins"></div>
                    </div>

                </div>
            </div>
        </section>

        <!-- Right Section (C) - Favorite Sensors -->
        <aside class="dashboard-favorites">
            <div class="favorites-container">
                <div class="favorites-header">
                    <h3 class="section-title">Favorite Sensors</h3>
                    <div class="favorites-controls">
                        <button class="btn btn-small" id="btn-clear-favorites">Clear All</button>
                    </div>
                </div>
                <div class="favorites-grid" id="favorites-grid">
                    <!-- Favorite sensor widgets will be inserted here -->
                </div>
                <div class="favorites-empty" id="favorites-empty" style="display: none;">
                    <p>Tap sensors in the middle pane to add them as favorites</p>
                </div>
            </div>
        </aside>

    </main>

    <!-- Footer -->
    <footer class="dashboard-footer">
        <div class="footer-content">
            <span class="footer-text" id="footer-info">Port: N/A | UID: N/A</span>
            <span class="footer-actions">
                <button class="btn btn-small btn-danger" id="btn-shutdown">SHUTDOWN</button>
                <span class="last-update" id="last-update">Last update: --</span>
            </span>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="/xeneon/static/js/dashboard.js"></script>
</body>
</html>
