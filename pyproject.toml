[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchlab-pytools"
dynamic = ["version"]
description = "Python control suite for BENCHLAB telemetry devices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "BENCHLAB.io" }]
keywords = ["benchlab", "telemetry", "hardware-monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "packaging>=23.0,<26.0",
    "python-dotenv>=1.0.0,<2.0",
    "textual>=0.60,<9.0",
    "benchlab-pycore>=0.5.1",
    "windows-curses>=2.4.1; platform_system=='Windows'",
]

[project.optional-dependencies]
tui = [
    "pyserial>=3.5",
]
csv_log = [
    "pyserial>=3.5",
    "benchlab-pycore>=0.5.1",
]
restapi = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.24.0",
    "pyserial>=3.5",
    "python-dotenv==1.1.1",
    "pydantic>=2.0.0",
]
mqtt = [
    "paho-mqtt>=2.0,<3.0",
    "amqtt>=0.12.0,<0.13.0",
    "pyyaml>=6.0,<7.0",
]
graph = [
    "dearpygui>=2.1.1",
    "pyserial>=3.5",
]
hwinfo = [
    "pyserial>=3.5",
]
vu = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "blessed>=1.20.0",
    "Pillow>=10.0.0",
    "pyserial>=3.5",
    "tornado",
    "numpy",
    "ruamel.yaml",
]
wigidash = [
    "Pillow>=11.3.0",
    "matplotlib>=3.10.7",
    "numpy>=2.2.0",
    "pyusb>=1.3.1",
    "pyserial>=3.5",
    "libusb-package>=1.0.26.1; sys_platform == 'win32'",
]
all = [
    "benchlab-pytools[tui,csv_log,restapi,mqtt,graph,hwinfo,vu,wigidash]",
]

[project.urls]
Homepage = "https://benchlab.io/"
Repository = "https://github.com/BenchLab-io/benchlab-pytools"
Issues = "https://github.com/BenchLab-io/benchlab-pytools/issues"

[project.scripts]
benchlab = "benchlab.main:main"

[tool.hatch.version]
path = "benchlab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["benchlab"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/test_*.py",
    "benchlab/vu/generated",
    "benchlab/vu/VU-Server/upload",
    "benchlab/vu/VU-Server/__pycache__",
    "benchlab/vu/VU-Server/*.db",
    "benchlab/vu/VU-Server/*.db-journal",
    "benchlab/vu/VU-Server/*.pid.lock",
    "benchlab/logs",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "benchlab/vu/generated",
    "benchlab/vu/VU-Server/upload",
    "benchlab/vu/VU-Server/__pycache__",
    "benchlab/vu/VU-Server/*.db",
    "benchlab/vu/VU-Server/*.db-journal",
    "benchlab/vu/VU-Server/*.pid.lock",
    "benchlab/logs",
    "tests",
    ".github",
]
